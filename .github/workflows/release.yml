name: Release on Tag

# Create a GitHub Release whenever a new tag is pushed.
# GitHub automatically attaches "Source code (zip)" and "Source code (tar.gz)"
# to the release, downloadable from the release page.
#
# Also triggerable manually (Actions -> Release on Tag -> Run workflow):
# it then releases the newest existing tag (e.g. 0.0.1).

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --generate-notes
          fi
